<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Lively Visualizer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --accent-rgb: 255, 255, 255;
    }

    body {
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
    }

    .visualizer-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .circle-card {
      position: relative;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: transparent;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(var(--accent-rgb), 0.35);
      box-shadow: 0 0 25px rgba(var(--accent-rgb), 0.15), inset 0 0 15px rgba(0, 0, 0, 0.6);
      user-select: none;
    }

    .track-info {
      position: relative;
      z-index: 2;
      padding: 20px;
      color: #e5e5e7;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
      max-width: 85%;
    }

    .title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
      color: #ffffff;
    }

    .artist {
      font-size: 12px;
      color: rgba(235, 235, 245, 0.75);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <video id="bg-video" autoplay loop muted playsinline src="background.mp4"></video>

  <canvas id="canvas"></canvas>

  <div class="visualizer-wrapper">
    <div class="circle-card">
      <div class="track-info">
        <div id="title" class="title">Spotify</div>
        <div id="artist" class="artist">Ожидание трека...</div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const BARS_COUNT = 64;
    let targetAudioData = new Array(BARS_COUNT).fill(0);
    let currentAudioData = new Array(BARS_COUNT).fill(0);

    const SHUFFLE_MAP = [];
    for (let i = 0; i < BARS_COUNT; i++) {
      SHUFFLE_MAP.push((i * 13) % BARS_COUNT);
    }

    const mouseTrail = [];
    let mouseIdleTimer = null;

    // Трекинг курсора с фильтрацией границ
    window.addEventListener('mousemove', (e) => {
      // 1. Проверка второго монитора: если мышь за пределами текущего экрана, очищаем след
      if (e.clientX < 0 || e.clientX > window.innerWidth || e.clientY < 0 || e.clientY > window.innerHeight) {
        mouseTrail.length = 0;
        return;
      }

      mouseTrail.push({
        x: e.clientX,
        y: e.clientY,
        life: 1.0
      });

      // 2. Сбрасываем шлейф при остановке движения (если кликнули в окно поверх)
      clearTimeout(mouseIdleTimer);
      mouseIdleTimer = setTimeout(() => {
        mouseTrail.length = 0;
      }, 120);
    });

    // 3. Сброс шлейфа при уходе фокуса / скрытии страницы
    document.addEventListener('mouseleave', () => { mouseTrail.length = 0; });
    window.addEventListener('blur', () => { mouseTrail.length = 0; });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) mouseTrail.length = 0;
    });

    function livelyAudioListener(audioArray) {
      if (!audioArray || audioArray.length === 0) return;
      
      const step = Math.max(1, Math.floor((audioArray.length * 0.65) / BARS_COUNT));
      
      for (let i = 0; i < BARS_COUNT; i++) {
        const val = audioArray[i * step] || 0;
        const freqMultiplier = 1.0 + Math.pow(i / BARS_COUNT, 1.4) * 3.0;
        targetAudioData[i] = val * 5.5 * freqMultiplier;
      }
    }

    function livelyCurrentTrack(data) {
      if (!data) return;
      
      let track = data;
      if (typeof data === 'string') {
        track = JSON.parse(data);
      }

      document.getElementById('title').innerText = track.Title || track.title || 'Unknown Track';
      document.getElementById('artist').innerText = track.Artist || track.artist || 'Unknown Artist';
    }

    function livelyPropertyListener(name, val) {}

    window.livelyAudioListener = livelyAudioListener;
    window.livelyCurrentTrack = livelyCurrentTrack;
    window.livelyPropertyListener = livelyPropertyListener;

    function draw() {
      requestAnimationFrame(draw);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // --- 1. Отрисовка сплошного шлейфа ---
      for (let i = mouseTrail.length - 1; i >= 0; i--) {
        mouseTrail[i].life -= 0.03;
        if (mouseTrail[i].life <= 0) {
          mouseTrail.splice(i, 1);
        }
      }

      if (mouseTrail.length > 2) {
        ctx.save();
        
        const leftPoints = [];
        const rightPoints = [];

        for (let i = 0; i < mouseTrail.length; i++) {
          const p = mouseTrail[i];
          const prev = mouseTrail[Math.max(0, i - 1)];
          const next = mouseTrail[Math.min(mouseTrail.length - 1, i + 1)];

          let dx = next.x - prev.x;
          let dy = next.y - prev.y;
          let len = Math.hypot(dx, dy) || 1;

          let nx = -dy / len;
          let ny = dx / len;

          const ratio = i / (mouseTrail.length - 1);
          const width = (0.5 + Math.pow(ratio, 1.4) * 11.5) * p.life;

          leftPoints.push({ x: p.x + nx * (width / 2), y: p.y + ny * (width / 2) });
          rightPoints.push({ x: p.x - nx * (width / 2), y: p.y - ny * (width / 2) });
        }

        ctx.beginPath();
        ctx.moveTo(leftPoints[0].x, leftPoints[0].y);

        for (let i = 1; i < leftPoints.length - 1; i++) {
          const xc = (leftPoints[i].x + leftPoints[i + 1].x) / 2;
          const yc = (leftPoints[i].y + leftPoints[i + 1].y) / 2;
          ctx.quadraticCurveTo(leftPoints[i].x, leftPoints[i].y, xc, yc);
        }
        ctx.lineTo(leftPoints[leftPoints.length - 1].x, leftPoints[leftPoints.length - 1].y);
        ctx.lineTo(rightPoints[rightPoints.length - 1].x, rightPoints[rightPoints.length - 1].y);

        for (let i = rightPoints.length - 2; i > 0; i--) {
          const xc = (rightPoints[i].x + rightPoints[i - 1].x) / 2;
          const yc = (rightPoints[i].y + rightPoints[i - 1].y) / 2;
          ctx.quadraticCurveTo(rightPoints[i].x, rightPoints[i].y, xc, yc);
        }
        ctx.lineTo(rightPoints[0].x, rightPoints[0].y);
        ctx.closePath();

        const head = mouseTrail[mouseTrail.length - 1];
        const tail = mouseTrail[0];
        const grad = ctx.createLinearGradient(tail.x, tail.y, head.x, head.y);
        grad.addColorStop(0, 'rgba(255, 255, 255, 0)');
        grad.addColorStop(1, 'rgba(255, 255, 255, 0.85)');

        ctx.fillStyle = grad;
        ctx.shadowBlur = 10;
        ctx.shadowColor = 'rgba(255, 255, 255, 0.6)';
        ctx.fill();

        ctx.restore();
      }

      // --- 2. Отрисовка визуализатора ---
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const baseRadius = 112;
      const maxBarHeight = 180;

      for (let i = 0; i < BARS_COUNT; i++) {
        currentAudioData[i] += (targetAudioData[i] - currentAudioData[i]) * 0.25;
      }

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.shadowBlur = 14;
      ctx.shadowColor = 'rgba(255, 255, 255, 0.6)';

      for (let i = 0; i < BARS_COUNT; i++) {
        const spectrumIndex = SHUFFLE_MAP[i];
        const angle = (i / BARS_COUNT) * Math.PI * 2 - Math.PI / 2;
        const value = currentAudioData[spectrumIndex] || 0;
        const barHeight = Math.min(value * maxBarHeight, maxBarHeight * 1.5);

        const x1 = cx + Math.cos(angle) * baseRadius;
        const y1 = cy + Math.sin(angle) * baseRadius;
        const x2 = cx + Math.cos(angle) * (baseRadius + barHeight);
        const y2 = cy + Math.sin(angle) * (baseRadius + barHeight);

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }
    }

    draw();
  </script>
</body>
</html>
