<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Lively Visualizer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --accent-rgb: 255, 255, 255;
    }

    body {
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
    }

    .visualizer-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      width: 600px;
      height: 600px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .circle-card {
      position: relative;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: transparent;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(var(--accent-rgb), 0.35);
      box-shadow: 0 0 25px rgba(var(--accent-rgb), 0.15), inset 0 0 15px rgba(0, 0, 0, 0.6);
      z-index: 3;
    }

    .track-info {
      position: relative;
      z-index: 2;
      padding: 20px;
      color: #e5e5e7;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
      max-width: 85%;
      user-select: none;
    }

    .title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
      color: #ffffff;
    }

    .artist {
      font-size: 12px;
      color: rgba(235, 235, 245, 0.75);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <video id="bg-video" autoplay loop muted playsinline src="background.mp4"></video>

  <div class="visualizer-wrapper">
    <canvas id="canvas" width="600" height="600"></canvas>

    <div class="circle-card">
      <div class="track-info">
        <div id="title" class="title">Spotify</div>
        <div id="artist" class="artist">Ожидание трека...</div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const BARS_COUNT = 64;
    let targetAudioData = new Array(BARS_COUNT).fill(0);
    let currentAudioData = new Array(BARS_COUNT).fill(0);

    // Генерируем карту перемешивания индексов (асимметричное распределение басов и высоких частот по кругу)
    const SHUFFLE_MAP = [];
    for (let i = 0; i < BARS_COUNT; i++) {
      SHUFFLE_MAP.push((i * 13) % BARS_COUNT);
    }

    function livelyAudioListener(audioArray) {
      if (!audioArray || audioArray.length === 0) return;
      
      const step = Math.max(1, Math.floor((audioArray.length * 0.65) / BARS_COUNT));
      
      for (let i = 0; i < BARS_COUNT; i++) {
        const val = audioArray[i * step] || 0;
        // Компенсация высоты для высоких частот
        const freqMultiplier = 1.0 + Math.pow(i / BARS_COUNT, 1.4) * 3.0;
        targetAudioData[i] = val * 5.5 * freqMultiplier;
      }
    }

    function livelyCurrentTrack(data) {
      if (!data) return;
      
      let track = data;
      if (typeof data === 'string') {
        track = JSON.parse(data);
      }

      const title = track.Title || track.title || 'Unknown Track';
      const artist = track.Artist || track.artist || 'Unknown Artist';

      document.getElementById('title').innerText = title;
      document.getElementById('artist').innerText = artist;
    }

    function livelyPropertyListener(name, val) {}

    window.livelyAudioListener = livelyAudioListener;
    window.livelyCurrentTrack = livelyCurrentTrack;
    window.livelyPropertyListener = livelyPropertyListener;

    function draw() {
      requestAnimationFrame(draw);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const baseRadius = 112;
      const maxBarHeight = 180;

      for (let i = 0; i < BARS_COUNT; i++) {
        currentAudioData[i] += (targetAudioData[i] - currentAudioData[i]) * 0.25;
      }

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.shadowBlur = 14;
      ctx.shadowColor = 'rgba(255, 255, 255, 0.6)';

      for (let i = 0; i < BARS_COUNT; i++) {
        // Берем перемешанный индекс частоты для создания асимметрии
        const spectrumIndex = SHUFFLE_MAP[i];
        const angle = (i / BARS_COUNT) * Math.PI * 2 - Math.PI / 2;
        const value = currentAudioData[spectrumIndex] || 0;
        const barHeight = Math.min(value * maxBarHeight, maxBarHeight * 1.5);

        const x1 = cx + Math.cos(angle) * baseRadius;
        const y1 = cy + Math.sin(angle) * baseRadius;
        const x2 = cx + Math.cos(angle) * (baseRadius + barHeight);
        const y2 = cy + Math.sin(angle) * (baseRadius + barHeight);

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }
    }

    draw();
  </script>
</body>
</html>
